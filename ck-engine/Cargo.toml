[package]
name = "ck-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Search engine implementation for ck semantic search"
repository = "https://github.com/BeaconBay/ck"
keywords = ["search", "engine", "semantic"]
categories = ["algorithms"]

[dependencies]
blake3 = { workspace = true }
ck-core = { workspace = true }
ck-index = { workspace = true }
ck-embed = { workspace = true }
ck-chunk = { workspace = true }
ck-models = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
tantivy = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }

[features]
# llamacpp is in the default set because every embedding model in ckq's registry
# is served by it. Without it there is no model, so semantic search cannot run
# and the tests that use it are compiled out rather than failing.
default = ["fastembed", "mixedbread", "llamacpp"]
fastembed = ["ck-embed/fastembed", "ck-index/fastembed", "ck-chunk/fastembed"]
mixedbread = ["ck-embed/mixedbread", "ck-index/mixedbread", "ck-chunk/mixedbread"]
llamacpp = ["ck-embed/llamacpp"]

[dev-dependencies]
# The tests that reach semantic search each load the model, and in CI they
# race each other for the same download lock. One at a time.
serial_test = "2.0"
tempfile = "3.27"
