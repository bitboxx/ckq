# Not a real crate: a feature forwarder. Cargo cannot make one crate's default
# feature platform-specific, and it refuses the same crate twice under two
# names, so rogo cannot turn llama-cpp-2's `vulkan` on by default for Linux and
# Windows only through its own [features]. It depends on this path crate
# instead, target-gated to non-macOS and optional; enabling rogo's `vulkan` or
# `cuda` feature pulls it in, and feature unification with rogo's own
# llama-cpp-2 dependency forwards the backend to the one copy of the crate.
[package]
name = "rogo-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
description = "Feature forwarder for rogo: turns on llama-cpp-2's Vulkan or CUDA backend away from macOS"
repository = "https://github.com/bitboxx/rogo"

[dependencies]
# Same version as rogo's own dependency: one resolved copy, one build.
llama-cpp-2 = "0.1.159"

[features]
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
