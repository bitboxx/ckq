[package]
name = "ckq"
version = "2.0.0-dev"
edition = "2024"
authors = ["Mike Renwick", "ckq contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitboxx/ckq"
rust-version = "1.88.0"
description = "Multilingual search over a folder of text: BM25 and embeddings, fused"
publish = false

# One crate. The eight upstream crates (ck-*) are being retired; until the last
# step of the rewrite removes them they stay in the tree, unbuilt, as a source
# to port from. Nothing here may depend on them.

[features]
# Build one GGUF into the binary itself: build.rs then requires CKQ_EMBED_GGUF
# (the file) and CKQ_EMBED_ALIAS (its registry alias), and that model becomes
# the build's default, so the one file works offline on a fresh machine. Off
# by default: a normal build downloads models on first use, as before.
embedded-model = []

# The GPU backend: Vulkan by default everywhere but macOS, where these
# features resolve to nothing — ckq-gpu is a dependency only under
# cfg(not(target_os = "macos")), so the Mac keeps its Metal build untouched.
# The shim exists because cargo cannot make a default feature
# platform-specific (and refuses one crate twice under two names);
# --no-default-features builds CPU-only; --no-default-features --features
# cuda builds CUDA alone (--features cuda by itself adds CUDA to Vulkan).
default = ["vulkan"]
vulkan = ["dep:ckq-gpu", "ckq-gpu?/vulkan"]
cuda = ["dep:ckq-gpu", "ckq-gpu?/cuda"]

[[bin]]
name = "ckq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
half = "2.6"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
ignore = "0.4"
regex = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.159", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.159" }
ckq-gpu = { path = "gpu", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "2.0"
tempfile = "3"

[build-dependencies]
blake3 = "1.8"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
