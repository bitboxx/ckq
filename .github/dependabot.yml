version: 2
updates:
  # Cargo — the single crate at the root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The ref of dtolnay/rust-toolchain is the Rust version it installs, and
      # the msrv job pins it to the MSRV on purpose; a bump would stop testing it.
      - dependency-name: dtolnay/rust-toolchain
