[package]
name = "ckq"
version = "2.0.0-dev"
edition = "2024"
authors = ["Mike Renwick", "ckq contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitboxx/ckq"
rust-version = "1.88.0"
description = "Multilingual search over a folder of text: BM25 and embeddings, fused"
publish = false

# One crate. The eight upstream crates (ck-*) are being retired; until the last
# step of the rewrite removes them they stay in the tree, unbuilt, as a source
# to port from. Nothing here may depend on them.

[[bin]]
name = "ckq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
half = "2.6"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
ignore = "0.4"
regex = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "e40decdb45d589925a370679d29f30454805c271", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "e40decdb45d589925a370679d29f30454805c271" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "2.0"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
