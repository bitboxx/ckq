[package]
name = "ck-embed"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Text embedding providers for ck semantic search"
repository = "https://github.com/BeaconBay/ck"
keywords = ["embedding", "nlp", "semantic"]
categories = ["science"]

[dependencies]
serde_json = { workspace = true }
ck-core = { workspace = true }
ck-models = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

fastembed = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
num_cpus = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }


# GPU backend per platform: Metal on Apple Silicon, Vulkan elsewhere (covers AMD,
# Intel and NVIDIA without vendor-specific builds, unlike DirectML or CUDA).
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["vulkan"] }

[target.'cfg(unix)'.dependencies]
# geteuid() for refusing sockets owned by another user (see embed_daemon).
libc = "0.2"

[features]
# llamacpp pulls mixedbread: its GGUF download goes through
# mixedbread::download_assets (hf-hub), and the daemon client shares the
# socket code, so the combination "llamacpp without mixedbread" was never
# buildable — now the feature says so instead of failing to compile.
llamacpp = ["dep:llama-cpp-2", "dep:parking_lot", "mixedbread"]
default = ["fastembed", "mixedbread"]
fastembed = ["dep:fastembed"]
mixedbread = [
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:ort",
    "dep:once_cell",
    "dep:ndarray",
    "dep:num_cpus",
]
