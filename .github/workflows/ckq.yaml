# The one CI workflow. `cargo test` stays offline: the e2e suites are
# #[ignore]d with an `e2e:` reason and run in the e2e job, which restores
# the default embedding model from the cache.
#
# Vulkan is a default cargo feature on every platform but macOS (see gpu/),
# so the Linux and Windows jobs must give llama.cpp's Vulkan backend what it
# needs at build time: headers, loader and the glslc shader compiler (plus
# SPIRV-Headers) from apt on Ubuntu, the LunarG SDK on Windows. The Linux
# runners get no Vulkan device (no ICD is installed), which llama.cpp handles
# by falling back to the CPU at runtime; the Windows runners get the Vulkan
# loader (vulkan-1.dll) so the binary, which links it, can start.
name: ckq

permissions:
  contents: read

on:
  push:
    branches: [main, v2, build/**]
  pull_request:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # llama-cpp-sys-2 builds llama.cpp from source.
      - uses: lukka/get-cmake@latest
      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
      - run: cargo clippy --release --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: lukka/get-cmake@latest
      - name: Install Vulkan build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
      # llama-cpp-sys-2's build script expects VULKAN_SDK on Windows and
      # links vulkan-1 from it; the action also puts the SDK's glslc on PATH.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          stripdown: true
      # The binary links vulkan-1.dll. Recent SDKs install it straight into
      # System32 (already on the DLL search path); older layouts keep it in
      # the SDK, which then needs to be on PATH.
      - name: Locate vulkan-1.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:VULKAN_SDK\runtime\x64\vulkan-1.dll",
            "$env:VULKAN_SDK\Bin\vulkan-1.dll",
            "C:\Windows\System32\vulkan-1.dll"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { throw "vulkan-1.dll not found in any of: $($candidates -join ', ')" }
          Write-Host "vulkan-1.dll: $found"
          if ($found -notlike 'C:\Windows\*') {
            Add-Content $env:GITHUB_PATH (Split-Path $found)
            Write-Host "Added $(Split-Path $found) to PATH"
          }
      - name: Test (offline)
        run: cargo test --release
      # Prove the default feature reached the backend: the resolved feature
      # graph, the loader the binary links, and the compiled SPIR-V shaders
      # (vulkan-shaders-gen only runs with GGML_VULKAN on).
      - name: Prove the Vulkan backend was built (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo tree -e features -i llama-cpp-2 | grep 'feature "vulkan"'
          ldd target/release/ckq | grep libvulkan
          find target -path '*llama-cpp-sys-2*' -name '*.spv' | head -3
      - name: Prove the Vulkan backend was built (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo tree -e features -i llama-cpp-2 | Select-String 'feature "vulkan"'
          $spv = Get-ChildItem target -Recurse -Filter '*.spv' | Select-Object -First 3
          if (-not $spv) { throw 'no SPIR-V shaders under target: GGML_VULKAN was off' }
          $spv | ForEach-Object { Write-Host "shader: $($_.FullName)" }

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: lukka/get-cmake@latest
      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
      - run: cargo check --locked --all-targets

  # The end-to-end suites run the real binary against real corpora with the
  # real default model. Windows is left out: the suites assert unix behaviour
  # (sockets, permissions) that does not apply there.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: lukka/get-cmake@latest
      - name: Install Vulkan build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers

      # A cache miss is fine: the first run downloads the model and the
      # cache is saved for the next one.
      - name: Restore embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/ckq/models
          key: ckq-models-gemma-q4

      - run: cargo e2e
